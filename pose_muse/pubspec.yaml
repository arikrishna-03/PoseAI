name: pose_muse
description: "PoseMuse - An AI photographer assistant generating scene-tailored photo ideas and live pose coaching."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation & Routing
  go_router: ^14.8.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Networking & Connectivity
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4

  # Camera & Hardware
  camera: ^0.11.0+2
  permission_handler: ^11.3.1
  flutter_vibrate: ^1.3.0
  flutter_tts: ^4.2.2
  image: ^4.5.3

  # Local Storage & Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # UI, Icons & Animations
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - prompt/
    - assets/models/
    - assets/icons/
